services: 
  db: 
    image: postgres:16
    environment: 
      POSTGRES_USER: tiket
      POSTGRES_PASSWORD: tiket
      POSTGRES_DB: tiket
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiket"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: