services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tiket
      POSTGRES_PASSWORD: tiket
      POSTGRES_DB: tiket
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiket -d tiket"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://tiket:tiket@db:5432/tiket
      ORDER_TTL_SECONDS: 900
      SWEEP_INTERVAL_SECONDS: 15
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata: